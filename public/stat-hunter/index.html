<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat Hunter — POC traces Strava</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>Stat Hunter <span class="tag">POC</span></h1>
  <p class="sub">Chasse aux chemins déjà parcourus — pas de carreaux, pas d'octogones.</p>

  <div id="connectBox">
    <button id="btnConnect" class="btn primary">Se connecter à Strava</button>
  </div>

  <div id="connectedBox" class="hidden">
    <p id="athleteInfo" class="muted"></p>
    <button id="btnLoad" class="btn primary">Charger mes traces</button>
    <button id="btnLogout" class="btn ghost">Déconnecter</button>
  </div>

  <p id="status" class="muted"></p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
